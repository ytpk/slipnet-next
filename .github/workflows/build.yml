name: Cellular APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellular-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENSSL_VERSION: '3.0.15'
      ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Use the installed JDK
        run: rm gradle/gradle-daemon-jvm.properties
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/slipstream-rust/target
          key: cellular-arm64-cargo-${{ hashFiles('app/src/main/rust/slipstream-rust/Cargo.lock') }}
          restore-keys: cellular-arm64-cargo-
      - uses: actions/cache@v4
        id: openssl
        with:
          path: ~/android-openssl
          key: cellular-arm64-openssl-3.0.15-ndk29
      - name: Build OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        run: bash app/scripts/build-openssl-android.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: gomobile-build/go.mod
          cache-dependency-path: gomobile-build/go.sum
      - name: Build Go bindings
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260204172633-1dceadbbeea3
          gomobile init
          make -C gomobile-build build-full GOMOBILE_TARGET=android/arm64
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and APK
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash gradlew :app:testFullDebugUnitTest :app:assembleFullDebug -PtargetAbis=arm64-v8a --no-daemon
      - name: Verify installable ARM64 APK
        run: |
          apk=$(find app/build/outputs/apk/full/debug -name '*-arm64-v8a.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -5
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: slipnet-next-arm64
          path: |
            app/build/outputs/apk/full/debug/*-arm64-v8a.apk
            app/build/outputs/apk/full/debug/*-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
